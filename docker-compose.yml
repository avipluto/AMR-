services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: amr_sentinel_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    volumes:
      - ./backend/data:/app/backend/data
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: amr_sentinel_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
